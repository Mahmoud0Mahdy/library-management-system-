<body>
    <!-- Navigation-->
    <nav class="navbar navbar-expand-lg ">

    <!-- Header-->
    <header class="bg-dark py-5">
        <div class="container px-4 px-lg-5 my-5">
            <div class="text-center text-white">
                <h1 class="display-shop">Shop in style</h1>
                <p class="lead fw-normal text-white-50 mb-0">With this shop homepage template</p>
            </div>
        </div>
    </header>

    <!-- Section-->
    <section class="py-5">
        <div class="container px-4 px-lg-5 mt-5">
            <div id="books" class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center">
                <!-- Dynamic Book Cards will be injected here -->
            </div>
        </div>
    </section>

    <!-- Footer-->
    <footer class="py-5 bg-dark">
        <div class="container">
            <p class="m-0 text-center text-white">Copyright &copy; Your Website 2023</p>
        </div>
    </footer>

    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Dynamic Script for managing books (this will add new books dynamically) -->
    <script>
        function addBookCard(image, title, author, publicationYear, category, availability) {
            const booksContainer = document.getElementById("books");
    
            const cardHTML = `
                <div class="col mb-5">
                    <div class="card h-100">
                        <!-- Product image-->
                        <img class="card-img-top" src="${image}" alt="${title}" />
                        <!-- Product details-->
                        <div class="card-body p-4">
                            <div class="text-center">
                                <!-- Product name-->
                                <h5 class="fw-bolder">${title}</h5>
                                <!-- Product details-->
                                <h6>By : ${author}</h6>
                                <h6>Publication Year : ${publicationYear}</h6>
                                <h6>Category : <span class="card-category">${category}</span></h6>
                                <h6>Available : <span class="card-ava">${availability}</span></h6>
                            </div>
                        </div>
                        <!-- Product actions-->
                        <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">
                            <button class="btn btn-outline-dark mt-auto">Loan</button>
                        </div>
                    </div>
                </div>
            `;
    
            // Inject the generated HTML into the books container
            booksContainer.innerHTML += cardHTML;
        }
    
        // Example of calling the function with custom values
        addBookCard(
            '/assets/imgssss/pride-and-prejudice-original-imagrvgfyymy4h3n.jpeg', 
            'Pride and Prejudice', 
            'Jane Austen', 
            '1813', 
            'Romance', 
            60
        );
        addBookCard('/assets/imgssss/loveofromance.jpg','dead&done I','ana','1919','horror',2);
        addBookCard('/assets/imgssss/Pride and Prejudice.jpg','dead&done II','ana brado','2020','dark comdey',17);
        addBookCard('/assets/imgssss/Pride and Prejudice.jpg'); 
        addBookCard('/assets/imgssss/Pride and Prejudice.jpg'); 
        addBookCard('/assets/imgssss/Pride and Prejudice.jpg');   
    </script>
    


    <!-- Core theme JS -->
    <!-- <script src="./js/bootstrap.bundle.min.js"></script> -->
    <!-- <script src="js/scripts.js"></script> -->   
<!-- Login Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="loginForm">
          <div class="modal-header">
            <h5 class="modal-title" id="loginModalLabel">Login</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="loginUsername" class="form-label">Username</label>
              <input type="text" class="form-control" id="loginUsername" required>
            </div>
            <div class="mb-3">
              <label for="loginPassword" class="form-label">Password</label>
              <input type="password" class="form-control" id="loginPassword" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-success">Login</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  
  <!-- Register Modal -->
  <div class="modal fade" id="exampleModal2" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="registerForm">
          <div class="modal-header">
            <h5 class="modal-title" id="registerModalLabel">Register</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3"><input type="text" class="form-control" placeholder="First Name" id="firstName" required></div>
            <div class="mb-3"><input type="text" class="form-control" placeholder="Last Name" id="lastName" required></div>
            <div class="mb-3"><input type="email" class="form-control" placeholder="Email" id="email" required></div>
            <div class="mb-3"><input type="text" class="form-control" placeholder="Username" id="username" required></div>
            <div class="mb-3"><input type="tel" class="form-control" placeholder="Phone Number" id="phone" pattern="^\d{10,15}$" 
                title="complete phone number" required></div>
            <div class="mb-3">
              <input type="password" class="form-control" placeholder="Password" id="password" 
                pattern="^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*]).{8,}$" 
                title="At least 8 characters, 1 uppercase, 1 number, 1 special character" required>
            </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-success">Register</button>
          </div>
        </form>
      </div>
    </div>
  </div> 
</body>

</html>
